<!DOCTYPE html>
<html>
<head>
  <title>Psychedelic Audio Visualizer (Log)</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      color: #fff;
      z-index: 500;
      border: 1px solid #444;
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease, opacity 0.3s ease;
      font-family: sans-serif;
    }
    #controls.hidden {
      transform: translateY(100px);
      opacity: 0;
      pointer-events: none;
    }
    #toggle-btn {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: transparent;
      color: rgba(255, 255, 255, 0.1);
      border: none;
      padding: 10px;
      cursor: pointer;
      z-index: 600;
      font-weight: bold;
      font-size: 20px;
      transition: color 0.3s ease;
    }
    #toggle-btn:hover {
      color: rgba(255, 255, 255, 0.8);
    }
    .control-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
    }
    input[type=range] {
      width: 150px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="visualizer"></canvas>
  <button id="toggle-btn">&lt;</button>
  <div id="controls" class="hidden">
    <div class="control-group">
      <label for="sensitivity">Sensitivity: <span id="sens-val">1.0</span>x</label>
      <input type="range" id="sensitivity" min="0.1" max="5" step="0.1" value="1.0">
    </div>
    <button id="hide-settings" style="width: 100%; background: #222; color: #fff; border: 1px solid #444; cursor: pointer; padding: 5px;">Hide</button>
  </div>
  <script>
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const controls = document.getElementById('controls');
    const toggleBtn = document.getElementById('toggle-btn');
    const sensitivityInput = document.getElementById('sensitivity');
    const sensValLabel = document.getElementById('sens-val');
    const hideSettingsBtn = document.getElementById('hide-settings');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let audioContext;
    let analyser;
    let dataArray;
    let source;
    let sensitivity = 1.0;
    let hideTimer;

    function resetHideTimer() {
      clearTimeout(hideTimer);
      if (!controls.classList.contains('hidden')) {
        hideTimer = setTimeout(() => {
          hideSettings();
        }, 3000);
      }
    }

    function hideSettings() {
      controls.classList.add('hidden');
      toggleBtn.style.display = 'block';
    }

    function showSettings() {
      controls.classList.remove('hidden');
      toggleBtn.style.display = 'none';
      resetHideTimer();
    }

    controls.addEventListener('mousemove', resetHideTimer);
    controls.addEventListener('mousedown', resetHideTimer);
    controls.addEventListener('touchstart', resetHideTimer);
    sensitivityInput.addEventListener('input', (e) => {
      sensitivity = parseFloat(e.target.value);
      sensValLabel.textContent = sensitivity.toFixed(1);
      resetHideTimer();
    });

    toggleBtn.addEventListener('click', showSettings);
    hideSettingsBtn.addEventListener('click', hideSettings);

    function initAudio() {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 2048;
          source = audioContext.createMediaStreamSource(stream);
          source.connect(analyser);

          const bufferLength = analyser.frequencyBinCount;
          dataArray = new Uint8Array(bufferLength);

          renderFrame();
        })
        .catch(function(err) {
          console.log('Error: ' + err);
        });
    }

    function renderFrame() {
      requestAnimationFrame(renderFrame);

      analyser.getByteFrequencyData(dataArray);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const bufferLength = analyser.frequencyBinCount;
      const numBars = 256;
      const barWidth = canvas.width / numBars;
      let x = 0;

      const fMin = 20;
      const fMax = audioContext.sampleRate / 2;
      const logFMin = Math.log(fMin);
      const logFMax = Math.log(fMax);
      const logRange = logFMax - logFMin;

      const freqToIndex = (f) => Math.round(f / fMax * bufferLength);

      for (let i = 0; i < numBars; i++) {
        const logF1 = (i / numBars) * logRange + logFMin;
        const logF2 = ((i + 1) / numBars) * logRange + logFMin;

        const f1 = Math.exp(logF1);
        const f2 = Math.exp(logF2);

        const startIndex = freqToIndex(f1);
        const endIndex = Math.min(freqToIndex(f2), bufferLength - 1);

        let sum = 0;
        let count = 0;
        for (let j = startIndex; j <= endIndex; j++) {
            sum += dataArray[j];
            count++;
        }

        const barHeight = (count > 0 ? sum / count : 0) * sensitivity;

        const hue = i / numBars * 360;
        ctx.fillStyle = 'hsl(' + hue + ', 100%, 50%)';
        ctx.fillRect(x, canvas.height - barHeight / 2, barWidth - 1, barHeight);

        x += barWidth;
      }
    }

    initAudio();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });
  </script>
</body>
</html>
