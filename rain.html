<!DOCTYPE html>
<html>
<head>
  <title>Psychedelic Audio Visualizer</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    #controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.7);
      padding: 15px;
      border-radius: 8px;
      color: #fff;
      z-index: 500;
      border: 1px solid #444;
      backdrop-filter: blur(5px);
      transition: transform 0.3s ease, opacity 0.3s ease;
      font-family: sans-serif;
    }
    #controls.hidden {
      transform: translateY(100px);
      opacity: 0;
      pointer-events: none;
    }
    #toggle-btn {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: transparent;
      color: rgba(255, 255, 255, 0.1);
      border: none;
      padding: 10px;
      cursor: pointer;
      z-index: 600;
      font-weight: bold;
      font-size: 20px;
      transition: color 0.3s ease;
    }
    #toggle-btn:hover {
      color: rgba(255, 255, 255, 0.8);
    }
    .control-group {
      margin-bottom: 10px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
      text-transform: uppercase;
    }
    input[type=range] {
      width: 150px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <canvas id="visualizer"></canvas>
  <button id="toggle-btn">&lt;</button>
  <div id="controls" class="hidden">
    <div class="control-group">
      <label for="sensitivity">Sensitivity: <span id="sens-val">1.0</span>x</label>
      <input type="range" id="sensitivity" min="0.1" max="5" step="0.1" value="1.0">
    </div>
    <button id="hide-settings" style="width: 100%; background: #222; color: #fff; border: 1px solid #444; cursor: pointer; padding: 5px;">Hide</button>
  </div>
  <script>
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d');
    const controls = document.getElementById('controls');
    const toggleBtn = document.getElementById('toggle-btn');
    const sensitivityInput = document.getElementById('sensitivity');
    const sensValLabel = document.getElementById('sens-val');
    const hideSettingsBtn = document.getElementById('hide-settings');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let audioContext;
    let analyser;
    let dataArray;
    let source;
    let sensitivity = 1.0;
    let hideTimer;

    function resetHideTimer() {
      clearTimeout(hideTimer);
      if (!controls.classList.contains('hidden')) {
        hideTimer = setTimeout(() => {
          hideSettings();
        }, 3000);
      }
    }

    function hideSettings() {
      controls.classList.add('hidden');
      toggleBtn.style.display = 'block';
    }

    function showSettings() {
      controls.classList.remove('hidden');
      toggleBtn.style.display = 'none';
      resetHideTimer();
    }

    controls.addEventListener('mousemove', resetHideTimer);
    controls.addEventListener('mousedown', resetHideTimer);
    controls.addEventListener('touchstart', resetHideTimer);
    sensitivityInput.addEventListener('input', (e) => {
      sensitivity = parseFloat(e.target.value);
      sensValLabel.textContent = sensitivity.toFixed(1);
      resetHideTimer();
    });

    toggleBtn.addEventListener('click', showSettings);
    hideSettingsBtn.addEventListener('click', hideSettings);

    class Particle {
        constructor(x, y, speed, color, size) {
            this.x = x;
            this.y = y;
            this.speed = speed;
            this.originalSpeed = speed;
            this.color = color;
            this.size = size;
            this.originalSize = size;
        }

        update() {
            this.y += this.speed;
            if (this.y > canvas.height) {
                this.y = 0 - this.size;
                this.x = Math.random() * canvas.width;
            }
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    let particles = [];
    let speedMultiplier = 1;

    function init() {
        for (let i = 0; i < 300; i++) {
            const x = Math.random() * canvas.width;
            const y = Math.random() * canvas.height;
            const speed = Math.random() * 2 + 1;
            const color = 'hsl(200, 100%, 50%)';
            const size = Math.random() * 2 + 1;
            particles.push(new Particle(x, y, speed, color, size));
        }
    }


    function initAudio() {
      navigator.mediaDevices.getUserMedia({ audio: true })
        .then(function(stream) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
          analyser = audioContext.createAnalyser();
          analyser.fftSize = 256;
          analyser.smoothingTimeConstant = 0.1;
          source = audioContext.createMediaStreamSource(stream);
          source.connect(analyser);

          const bufferLength = analyser.frequencyBinCount;
          dataArray = new Uint8Array(bufferLength);

          init();
          renderFrame();
        })
        .catch(function(err) {
          console.log('Error: ' + err);
        });
    }

    function renderFrame() {
      requestAnimationFrame(renderFrame);

      analyser.getByteFrequencyData(dataArray);

      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const bufferLength = analyser.frequencyBinCount;
      
      let bass = 0;
      for (let i = 0; i < bufferLength / 4; i++) {
        bass += dataArray[i];
      }
      bass /= (bufferLength / 4);
      bass *= sensitivity;

      if (bass > 80) {
          speedMultiplier = 1 + (bass - 80) / 10;
      } else {
          speedMultiplier *= 0.95;
          if (speedMultiplier < 1) speedMultiplier = 1;
      }


      particles.forEach(particle => {
        particle.speed = particle.originalSpeed * speedMultiplier;
        particle.size = particle.originalSize * speedMultiplier;
        const hue = (particle.y / canvas.height * 100 + 180) % 360;
        particle.color = `hsl(${hue}, 100%, 50%)`;
        particle.update();
        particle.draw();
      });
    }

    initAudio();

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        particles = [];
        init();
    });
  </script>
</body>
</html>
